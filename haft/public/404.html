<html lang="fa" dir="rtl">
  <head>

    <title>صفحه پیدا نشد | هفت استودیو</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #04070d; color: #f2f6fc; font-family: system-ui, Tahoma, sans-serif; text-align: center; padding: 24px; }
      h1 { font-size: 28px; margin: 0 0 12px; }
      p { color: #98a3b5; margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 28px; border-radius: 999px; background: #1a8cff; color: #ffffff; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 2px solid #1a8cff; outline-offset: 3px; }
    </style>

  <body>
    <main>
      <h1>صفحه‌ای که دنبالش بودید پیدا نشد.</h1>
      <p>ممکن است آدرس را اشتباه وارد کرده باشید.</p>
      <a href="/">بازگشت به صفحه‌ی اصلی</a>
    </main>
