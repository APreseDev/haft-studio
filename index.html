<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="dns-prefetch" href="https://api.web3forms.com" />
    <link rel="preload" as="image" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هفت استودیو | طراحی سایت، ویدیو و تبلیغات</title>
    <meta name="description" content="هفت استودیو: طراحی سایت، ویدیو و ریلز اینستاگرام، مدیریت محتوا و پیج، و طراحی کمپین تبلیغاتی." />
    <meta name="theme-color" content="#0a0a0d" />
    <style>
      /* صفحه‌ی آغازین: لوگو چند ثانیه نشان داده می‌شود تا کاربر بارگذاری اولیه‌ی سایت را نبیند (کنترل رفتنش: src/splash.js) */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0a0a0d;
        transition: opacity 0.6s ease, visibility 0.6s;
        /* اگر جاوااسکریپت اجرا نشد، بعد از ۷ ثانیه خودش کنار می‌رود */
        animation: splash-failsafe 0.4s ease 7s forwards;
      }
      #splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash img {
        display: block;
        height: clamp(150px, 26vh, 230px);
        width: auto;
        opacity: 0.94;
        animation: splash-in 0.9s ease both;
      }
      .splash__bar {
        width: 72px;
        height: 2px;
        background: #ede2c9;
        opacity: 0.55;
        transform-origin: 50% 50%;
        animation: splash-bar 2.4s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      html[data-theme="light"] #splash {
        background: #f6f1e7;
      }
      html[data-theme="light"] #splash img {
        filter: invert(1);
      }
      html[data-theme="light"] .splash__bar {
        background: #1d1810;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: translateY(10px) scale(0.97); }
        to { opacity: 0.94; transform: none; }
      }
      @keyframes splash-bar {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes splash-failsafe {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash img, .splash__bar { animation: none; transition: none; }
        #splash.is-hidden { opacity: 0; }
        #splash { animation: splash-failsafe 0.01s ease 7s forwards; }
      }
    </style>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="هفت استودیو" />
    <meta property="og:title" content="هفت استودیو | طراحی سایت، ویدیو و تبلیغات" />
    <meta property="og:description" content="هفت استودیو: طراحی سایت، ویدیو و ریلز اینستاگرام، مدیریت محتوا و پیج، و طراحی کمپین تبلیغاتی." />
    <meta name="twitter:card" content="summary" />
    <!-- زبان (از آدرس: /en/ انگلیسی) و حالت (تیره/روشن) ذخیره‌شده را پیش از اولین نمایش می‌گذارد تا هنگام بارگذاری چشمک نزند.
         اگر متن این اسکریپت را عوض کردید، هش آن را در public/_headers (script-src) هم به‌روز کنید: PROJECT_DOCUMENTATION.md -->
    <script>(function(){try{var d=document.documentElement,p=location.pathname;var l=/\/en(\/|$)/.test(p)?'en':'fa';d.setAttribute('lang',l);d.setAttribute('dir',l==='en'?'ltr':'rtl');var t=window.localStorage.getItem('haft-theme');if(t==='light'||t==='dark'){d.setAttribute('data-theme',t);if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#f6f1e7');}}}catch(e){}})();</script>
  </head>

      <style>#splash { display: none; }</style>

        <p>برای دیدن این سایت، جاوااسکریپت مرورگر را فعال کنید.</p>
      </div>
    </noscript>
    <div id="splash" aria-hidden="true">
      <img src="/logo-full.png" alt="" width="212" height="288" />
      <span class="splash__bar"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
